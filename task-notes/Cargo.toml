[package]
name = "task-notes"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"